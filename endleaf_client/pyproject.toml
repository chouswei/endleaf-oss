[project]
name = "endleaf-client"
version = "0.1.0"
description = "Local stdio MCP client for Endleaf by InkMirage. Writes result bytes to disk."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "starlette>=0.41",
]

[project.scripts]
endleaf-mcp = "endleaf_client.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
